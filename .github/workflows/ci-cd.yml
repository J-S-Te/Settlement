name: settlement-ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settlement-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test ./...
      - run: go vet ./...
      # CI 构建范围须与不可变运行时镜像及远程部署契约
      # 实际执行的二进制程序保持一致。
      - run: go build ./cmd/api ./cmd/worker ./cmd/migrate ./cmd/catalog-sync

  image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_ref: ${{ steps.result.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        shell: bash
        env:
          # 镜像仓库端点可随执行器和网络变化，但 Settlement 仓库名称固定。
          # 复用仓库级的 ACR_NAMESPACE/ACR_REPOSITORY 配置曾导致
          # 镜像路径重复拼接为 .../settlement/settlement/settlement，
          # 并使 ACR 以 insufficient_scope 拒绝推送。
          # 因此命名空间和仓库名在此统一指定。
          ACR_PUSH_REGISTRY: ${{ vars.ACR_PUSH_REGISTRY || 'jszn666test-registry.cn-hangzhou.cr.aliyuncs.com' }}
          ACR_PULL_REGISTRY: ${{ vars.ACR_PULL_REGISTRY || 'jszn666test-registry-vpc.cn-hangzhou.cr.aliyuncs.com' }}
          ACR_NAMESPACE: full_lifecycle_management
          ACR_REPOSITORY: settlement
        run: |
          set -Eeuo pipefail
          : "${ACR_PUSH_REGISTRY:?missing ACR_PUSH_REGISTRY}"
          : "${ACR_PULL_REGISTRY:?missing ACR_PULL_REGISTRY}"
          : "${ACR_NAMESPACE:?missing ACR_NAMESPACE}"
          : "${ACR_REPOSITORY:?missing ACR_REPOSITORY}"
          # docker/login-action 只接受镜像仓库主机名。
          # 登录和构造镜像引用前，均须移除
          # 误配置的命名空间或仓库路径后缀。
          push_registry="${ACR_PUSH_REGISTRY#https://}"
          push_registry="${push_registry#http://}"
          push_registry="${push_registry%%/*}"
          pull_registry="${ACR_PULL_REGISTRY#https://}"
          pull_registry="${pull_registry#http://}"
          pull_registry="${pull_registry%%/*}"
          [[ "$push_registry" == *.cr.aliyuncs.com ]] || {
            echo "ACR_PUSH_REGISTRY must contain an Aliyun registry host" >&2
            exit 1
          }
          [[ "$pull_registry" == *.cr.aliyuncs.com ]] || {
            echo "ACR_PULL_REGISTRY must contain an Aliyun registry host" >&2
            exit 1
          }
          echo "push_registry=${push_registry}" >> "$GITHUB_OUTPUT"
          echo "image=${push_registry}/${ACR_NAMESPACE}/${ACR_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "deploy_image=${pull_registry}/${ACR_NAMESPACE}/${ACR_REPOSITORY}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.vars.outputs.push_registry }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          build-args: |
            APP_VERSION=${{ github.sha }}
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.vars.outputs.image }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - id: result
        shell: bash
        run: echo "image_ref=${{ steps.vars.outputs.deploy_image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: test
    steps:
      - name: Run remote migrations and deploy immutable settlement image
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/unified-identity-platform' }}
          IMAGE_REF: ${{ needs.image.outputs.image_ref }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_USER:?missing DEPLOY_USER}"
          : "${DEPLOY_HOST:?missing DEPLOY_HOST}"
          : "${DEPLOY_SSH_KEY:?missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing DEPLOY_KNOWN_HOSTS}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf -v remote_command \
            'command -v bash >/dev/null && test -x %q/bin/deploy-service.sh && cd %q && DEPLOY_FAIL_IF_RUNTIME_NOT_READY=true bash ./bin/deploy-service.sh settlement %q' \
            "$DEPLOY_PATH" "$DEPLOY_PATH" "$IMAGE_REF"
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$remote_command"
